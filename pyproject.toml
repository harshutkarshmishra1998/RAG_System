[project]
name = "rag-system"
version = "0.1.0"
description = "RAG system with robust multimodal ingestion"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "regex==2023.12.25",
    "pydantic==2.6.1",
    "python-magic-bin==0.4.14",
    "pdfplumber==0.11.4",
    "pdf2image==1.17.0",
    "pytesseract>=0.3.10",
    "pillow>=10.2.0",
    "camelot-py==0.11.0",
    "opencv-python==4.9.0.80",
    "python-docx>=1.1.0",
    "youtube-transcript-api==0.6.2",
    "google-api-python-client>=2.110.0",
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "python-dotenv>=1.0.0",
    "yt-dlp>=2024.1.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-core>=0.1.0",
    "pypdf>=4.0.0",
    "charset-normalizer>=3.3.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*SwigPy.*:DeprecationWarning",
]
